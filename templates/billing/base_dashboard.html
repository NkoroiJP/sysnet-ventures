<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysnet Ventures Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @media print {
            @page {
                size: A4;
                margin: 15mm;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color: #111827 !important;
                font-size: 11pt !important;
            }
            .shadow, .rounded-lg {
                box-shadow: none !important;
            }
            .h-screen {
                height: auto !important;
                overflow: visible !important;
            }
            .flex {
                display: flex !important;
            }
            .justify-between {
                justify-content: space-between !important;
            }
            .items-start {
                align-items: flex-start !important;
            }
            .items-center {
                align-items: center !important;
            }
            .w-64, .md\:flex {
                display: none !important;
            }
            .overflow-hidden, .overflow-y-auto {
                overflow: visible !important;
            }
            main {
                padding: 0 !important;
            }
            .max-w-7xl {
                max-width: 100% !important;
            }
            table {
                page-break-inside: auto;
                border-collapse: collapse !important;
                width: 100% !important;
            }
            tr {
                page-break-inside: avoid !important;
                page-break-after: auto;
            }
            thead {
                display: table-header-group;
            }
            .bg-brand-900 {
                background-color: #0c4a6e !important;
                color: white !important;
            }
            .bg-brand-50 {
                background-color: #f0f9ff !important;
            }
            .bg-gray-50 {
                background-color: #f9fafb !important;
            }
            .text-brand-600 {
                color: #0284c7 !important;
            }
            .text-brand-700 {
                color: #0369a1 !important;
            }
            .border-brand-600 {
                border-color: #0284c7 !important;
            }
            .border-b-2 {
                border-bottom-width: 2pt !important;
            }
        }
        .print-only {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="hidden md:flex md:flex-shrink-0 no-print">
            <div class="flex flex-col w-64">
                <div class="flex flex-col h-0 flex-1 bg-brand-900 shadow-xl">
                    <div class="flex-1 flex flex-col pt-5 pb-4 overflow-y-auto">
                        <div class="flex items-center flex-shrink-0 px-4 mb-6">
                            <span class="text-white text-2xl font-bold">Sysnet</span>
                        </div>
                        <nav class="mt-5 flex-1 px-2 space-y-1">
                            <a href="{% url 'dashboard' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-white bg-brand-800">
                                <i class="fas fa-home mr-3 text-brand-300"></i>
                                Dashboard
                            </a>

                            <a href="{% url 'quotation_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-file-alt mr-3 text-brand-300 group-hover:text-white"></i>
                                Quotations
                            </a>

                            <a href="{% url 'invoice_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-file-invoice-dollar mr-3 text-brand-300 group-hover:text-white"></i>
                                Invoices
                            </a>

                            <a href="{% url 'customer_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-users mr-3 text-brand-300 group-hover:text-white"></i>
                                Customers
                            </a>

                            <a href="{% url 'product_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-box mr-3 text-brand-300 group-hover:text-white"></i>
                                Products
                            </a>

                             <a href="{% url 'receipt_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-receipt mr-3 text-brand-300 group-hover:text-white"></i>
                                Receipts
                            </a>

                            <a href="{% url 'message_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white relative">
                                <i class="fas fa-comments mr-3 text-brand-300 group-hover:text-white"></i>
                                Messages
                                {% if unread_count > 0 %}
                                <span class="absolute right-2 top-2 inline-flex items-center justify-center h-5 w-5 rounded-full bg-red-500 text-white text-xs font-bold">
                                    {{ unread_count }}
                                </span>
                                {% endif %}
                            </a>

                            <div class="pt-4 mt-4 border-t border-brand-800">
                                <a href="{% url 'company_settings' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                    <i class="fas fa-cog mr-3 text-brand-300 group-hover:text-white"></i>
                                    Settings
                                </a>
                            </div>
                        </nav>
                    </div>
                    <div class="flex-shrink-0 flex border-t border-brand-800 p-4">
                        <div class="flex items-center">
                            <div class="ml-3">
                                <p class="text-sm font-medium text-white">
                                    {{ user.username|title }}
                                </p>
                                <form action="{% url 'logout' %}" method="post" class="inline">
                                    {% csrf_token %}
                                    <button type="submit" class="text-xs font-medium text-brand-200 hover:text-white group-hover:text-white">
                                        Logout
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col w-0 flex-1 overflow-hidden">
            <main class="flex-1 relative overflow-y-auto focus:outline-none">
                <div class="py-6">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 mb-6 no-print">
                        <h1 class="text-2xl font-semibold text-gray-900">Dashboard Overview</h1>
                    </div>
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8">
                        {% block dashboard_content %}{% endblock %}
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
