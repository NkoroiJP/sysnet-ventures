<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysnet Ventures Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">
    
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <div class="hidden md:flex md:flex-shrink-0">
            <div class="flex flex-col w-64">
                <div class="flex flex-col h-0 flex-1 bg-brand-900 shadow-xl">
                    <div class="flex-1 flex flex-col pt-5 pb-4 overflow-y-auto">
                        <div class="flex items-center flex-shrink-0 px-4 mb-6">
                            <span class="text-white text-2xl font-bold">Sysnet</span>
                        </div>
                        <nav class="mt-5 flex-1 px-2 space-y-1">
                            <a href="{% url 'dashboard' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-white bg-brand-800">
                                <i class="fas fa-home mr-3 text-brand-300"></i>
                                Dashboard
                            </a>
                            
                            <a href="{% url 'quotation_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-file-alt mr-3 text-brand-300 group-hover:text-white"></i>
                                Quotations
                            </a>

                            <a href="{% url 'invoice_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-file-invoice-dollar mr-3 text-brand-300 group-hover:text-white"></i>
                                Invoices
                            </a>

                            <a href="{% url 'customer_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-users mr-3 text-brand-300 group-hover:text-white"></i>
                                Customers
                            </a>

                             <a href="{% url 'receipt_list' %}" class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-brand-100 hover:bg-brand-800 hover:text-white">
                                <i class="fas fa-receipt mr-3 text-brand-300 group-hover:text-white"></i>
                                Receipts
                            </a>
                        </nav>
                    </div>
                    <div class="flex-shrink-0 flex border-t border-brand-800 p-4">
                        <div class="flex items-center">
                            <div class="ml-3">
                                <p class="text-sm font-medium text-white">
                                    {{ user.username|title }}
                                </p>
                                <form action="{% url 'logout' %}" method="post" class="inline">
                                    {% csrf_token %}
                                    <button type="submit" class="text-xs font-medium text-brand-200 hover:text-white group-hover:text-white">
                                        Logout
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col w-0 flex-1 overflow-hidden">
            <main class="flex-1 relative overflow-y-auto focus:outline-none">
                <div class="py-6">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 mb-6">
                        <h1 class="text-2xl font-semibold text-gray-900">Dashboard Overview</h1>
                    </div>
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8">
                        {% block dashboard_content %}{% endblock %}
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
