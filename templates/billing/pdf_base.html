{% load static %}<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: a4 portrait;
      margin: 1.6cm 1.4cm 2.2cm 1.4cm;
      @frame footer_frame {
        -pdf-frame-content: footer_content;
        left: 40pt; width: 515pt; top: 780pt; height: 40pt;
      }
    }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1e293b; }
    .brand-header { width: 100%; border-bottom: 3pt solid #1d4ed8; padding-bottom: 8pt; margin-bottom: 14pt; }
    .brand-name { font-size: 17pt; font-weight: bold; color: #1d4ed8; }
    .brand-meta { font-size: 8.5pt; color: #64748b; }
    .doc-title { font-size: 21pt; font-weight: bold; color: #1e293b; letter-spacing: 1pt; }
    .doc-number { font-size: 11pt; color: #1d4ed8; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 8pt; }
    th { background-color: #1d4ed8; color: #ffffff; font-size: 8.5pt; padding: 6pt 5pt; text-align: left; }
    td { font-size: 9pt; padding: 5pt; border-bottom: 0.5pt solid #e2e8f0; vertical-align: top; }
    .num { text-align: right; }
    .totals td { border: none; padding: 2.5pt 5pt; }
    .totals .grand { font-size: 12pt; font-weight: bold; color: #1d4ed8; border-top: 1.5pt solid #1d4ed8; }
    .muted { color: #64748b; }
    .small { font-size: 8pt; }
    .badge { padding: 2pt 8pt; border-radius: 3pt; font-size: 8pt; font-weight: bold; color: #1d4ed8; background-color: #dbeafe; }
    .info-box { background-color: #f1f5f9; padding: 8pt; border-radius: 4pt; margin-top: 8pt; }
    h3 { font-size: 10pt; color: #1d4ed8; margin: 12pt 0 4pt 0; text-transform: uppercase; letter-spacing: 0.5pt; }
    .footer-line { border-top: 0.5pt solid #cbd5e1; padding-top: 4pt; font-size: 7.5pt; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  {% block doc %}{% endblock %}

  <div id="footer_content">
    <div class="footer-line">
      {% if company.document_footer %}{{ company.document_footer }} · {% endif %}
      {{ company.name }}{% if company.kra_pin %} · PIN: {{ company.kra_pin }}{% endif %} · {{ company.phone }}
    </div>
  </div>
</body>
</html>
