{% extends 'billing/base_dashboard.html' %}

{% block dashboard_content %}
<div class="max-w-3xl mx-auto bg-white shadow rounded-lg">
    <div class="px-4 py-5 border-b border-gray-200 sm:px-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900">{{ title }}</h3>
    </div>
    <form method="post" class="p-6 space-y-6">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
            <div class="sm:col-span-6">
                <label for="{{ form.name.id_for_label }}" class="block text-sm font-medium text-gray-700">Full Name / Company Name</label>
                {{ form.name }}
                {{ form.name.errors }}
            </div>

            <div class="sm:col-span-3">
                <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700">Email Address</label>
                {{ form.email }}
                {{ form.email.errors }}
            </div>

            <div class="sm:col-span-3">
                <label for="{{ form.phone.id_for_label }}" class="block text-sm font-medium text-gray-700">Phone Number</label>
                {{ form.phone }}
                {{ form.phone.errors }}
            </div>

            <div class="sm:col-span-6">
                <label for="{{ form.address.id_for_label }}" class="block text-sm font-medium text-gray-700">Address</label>
                {{ form.address }}
                {{ form.address.errors }}
            </div>
        </div>

        <div class="flex justify-end pt-4">
            <a href="{% url 'customer_list' %}" class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 mr-3">Cancel</a>
            <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500">Save Customer</button>
        </div>
    </form>
</div>
{% endblock %}
