services:
  web:
    build: .
    restart: unless-stopped
    command: /app/entrypoint.sh
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      # Dev profile (default): SQLite. For production set DATABASE_URL to Postgres.
      - DATABASE_URL=${DATABASE_URL:-}
      - TIME_ZONE=${TIME_ZONE:-Africa/Nairobi}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
    volumes:
      - ./data:/app/data:Z
      - ./media:/app/media:Z
    ports:
      - '8000:8000'

  # Optional production database. `docker compose --profile postgres up -d`
  db:
    image: postgres:16-alpine
    profiles: ['postgres']
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sysnet
      - POSTGRES_USER=sysnet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sysnet']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
