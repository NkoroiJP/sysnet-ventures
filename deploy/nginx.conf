upstream sysnet_web {
    server web:8000;
    keepalive 32;
}

# Rate-limit zones for auth and public forms
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=form_zone:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ------------------------------------------------------------------
    # TLS: to enable, mount fullchain.pem/privkey.pem at /etc/nginx/certs/
    # (see docker-compose.prod.yml volumes) and replace the `listen 80;`
    # line above with the two lines below, then reload nginx.
    #
    #   listen 443 ssl;
    #   http2  on;
    #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    # Recommended certbot flow (host-level):
    #   certbot certonly --standalone -d yourdomain.com
    #   -> copy /etc/letsencrypt/live/yourdomain.com/{fullchain,privkey}.em
    #      to deploy/certs/ and mount as above.
    # ------------------------------------------------------------------

    # NOTE: /static/ and /media/ are NOT served here on purpose.
    # - Static files are served by WhiteNoise inside the web container
    #   (versioned, compressed, correct caching headers).
    # - Media is served by Django's permission-checked protected_media view,
    #   so payment evidence can never be fetched without authentication.
    # Everything is proxied to the app below.

    # Rate-limited auth endpoints
    location ~ ^/(accounts/login|portal/login)/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://sysnet_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Rate-limited public forms
    location ~ ^/(contact|request-quote)/ {
        limit_req zone=form_zone burst=30 nodelay;
        proxy_pass http://sysnet_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://sysnet_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
