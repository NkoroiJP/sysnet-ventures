# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds an Nginx reverse proxy on 80/443, removes the direct web port
# publishing, and turns on production security settings.
services:
  web:
    environment:
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-False}
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-31536000}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - STAFF_NOTIFY_EMAIL=${STAFF_NOTIFY_EMAIL:-}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Replace the image's default.conf entirely (its default_server block
      # would otherwise shadow this vhost for unmatched Host headers).
      # The trailing :z relabels the file for container access (SELinux hosts).
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./deploy/certs:/etc/nginx/certs:ro,z
    depends_on:
      web:
        condition: service_healthy
